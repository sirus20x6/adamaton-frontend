name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # The frontend sub-repo has no Dockerfile checked in (SPA + nginx is
      # generic enough that the workflow synthesizes one in the runner
      # tmpfs). This keeps the constraint of only touching .github/ while
      # still producing a usable image.
      - name: Synthesize Dockerfile
        run: |
          cat > Dockerfile.ci <<'EOF'
          # Build stage: node 22 alpine builds the Vite SPA.
          FROM node:lts-alpine AS build
          WORKDIR /app
          COPY package.json package-lock.json* ./
          RUN npm ci --no-audit --no-fund
          COPY . .
          RUN npm run build

          # Serve stage: nginx:alpine serves the static dist/.
          FROM nginx:alpine
          # SPA-style fallback: route unknown paths back to index.html so
          # client-side routing works (the operator's existing pi5 caddy
          # config does the same thing in front of dist/).
          RUN printf '%s\n' \
              'server {' \
              '  listen 80;' \
              '  root /usr/share/nginx/html;' \
              '  index index.html;' \
              '  location / { try_files $uri $uri/ /index.html; }' \
              '}' > /etc/nginx/conf.d/default.conf
          COPY --from=build /app/dist /usr/share/nginx/html
          EXPOSE 80
          EOF

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/sirus20x6/adamaton-frontend
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
